services:
  postgres:
    image: postgres:16-alpine
    container_name: sehatdoc-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sehatdoc
    volumes:
      - sehatdoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sehatdoc']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sehatdoc_pgdata:
